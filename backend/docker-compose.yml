name: beemahealth_portal

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    ports:
      - "5433:5432"
    volumes:
      - portal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: >
      sh -c "python manage.py migrate &&
      python manage.py load_definitions --dev &&
      (python manage.py createsuperuser --noinput || true) &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    environment:
      DEBUG: "true"
      SECRET_KEY: dev-secret-key-change-in-production
      DATABASE_URL: postgres://portal:portal@db:5432/portal
      DATABASE_SSL_REQUIRE: "false"
      SECURE_SSL_REDIRECT: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081
      CSRF_TRUSTED_ORIGINS: http://localhost:8001,http://localhost:8080,http://localhost:8081
      FIELD_ENCRYPTION_KEY: u0N0ZxQ2m3g8m4j3Qy0r2tq1o9mV6o3Qw8nJrP8n2vA=
      PORTAL_BASE_URL: http://localhost:8080
      DJANGO_SUPERUSER_EMAIL: admin@beemahealth.local
      DJANGO_SUPERUSER_PASSWORD: admin
      # Sign-in emails: real SMTP when EMAIL_HOST is set (scripts/dev-backend.sh loads it from
      # the root .env.dev), otherwise printed to the API log.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      SES_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@beemahealth.com}
      BELUGA_FAKE_MODE: "true"
      BELUGA_WEBHOOK_SECRET: dev-secret
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  portal_postgres_data:
